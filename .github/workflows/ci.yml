name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Releases from main run one at a time, so two quick merges cannot both
# compute the same next version. A newer queued run replaces an older queued
# one, and still releases its commits, because it sits on top of them. Pull
# request runs cancel a superseded run of the same branch.
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: make test

  # The release scripts, against a throwaway repo and the pinned git-mkver.
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make bats

  # The build matrix comes from the backend registry, so a new fake is built
  # and smoke-tested here as soon as it is registered.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.list.outputs.all }}
      published: ${{ steps.list.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - id: list
        run: |
          echo "all=$(uv run --no-dev python utils/list_images.py)" >> "$GITHUB_OUTPUT"
          echo "published=$(uv run --no-dev python utils/list_images.py --published)" >> "$GITHUB_OUTPUT"

  # Every registered backend, built for amd64 and smoke-tested. Nothing is
  # pushed: images are only published by a release.
  image:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.all) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ matrix.image }}:ci
          build-args: |
            BACKEND=${{ matrix.backend }}
      - run: utils/smoke_test_image.sh "${{ matrix.image }}:ci"

  # What version would merging this release? Printed on every pull request,
  # so a surprise major bump is seen before the merge, not after it.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # mkver reads every tag and the commits since the last one.
          fetch-depth: 0
      - name: Install git-mkver
        run: utils/install_git_mkver.sh
      - run: utils/next_version.sh --report

  # --- release: pushes to main only -------------------------------------

  plan:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test, bats, matrix, image]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      release: ${{ steps.next.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install git-mkver
        run: utils/install_git_mkver.sh
      - id: next
        run: utils/next_version.sh >> "$GITHUB_OUTPUT"
      - if: needs.matrix.outputs.published == '[]'
        run: echo "::notice title=No release::No backend is published yet, so there is nothing to release."

  publish:
    needs: [matrix, plan]
    if: needs.plan.outputs.release == 'true' && needs.matrix.outputs.published != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.published) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.plan.outputs.version }}
          build-args: |
            BACKEND=${{ matrix.backend }}
            VERSION=${{ needs.plan.outputs.version }}
      - run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.image }}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      # A release whose images consumers cannot pull is never announced.
      - name: Check every image is public
        run: |
          for file in digests/*; do
            utils/check_image_public.sh "${{ github.repository_owner }}/$(basename "${file}")" "${{ needs.plan.outputs.version }}"
          done
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: utils/create_release.sh "${{ needs.plan.outputs.version }}" digests
