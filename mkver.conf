# git-mkver computes each release's version from the tags and the Conventional
# Commit messages since the last one. Nothing is written back to the repo: the
# tag is the only record of a version. See docs/design/adr/0005-release-from-tags.md.
tagPrefix: v
defaults {
  # The release job tags through `gh release create`, not `git mkver tag`.
  tag: false
  tagMessageFormat: "release {Tag}"
  preReleaseFormat: "RC{PreReleaseNumber}"
  buildMetaDataFormat: "{Branch}.{ShortHash}"
  # Image tags must be a plain X.Y.Z.
  includeBuildMetaData: false
  # A branch of only docs:/chore:/ci:/test:/refactor: commits releases a
  # patch, as in the CLIs.
  whenNoValidCommitMessages: IncrementPatch
}
